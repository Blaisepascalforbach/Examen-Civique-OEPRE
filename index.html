<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3a93">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Examen civique · CSP · Révision</title>
<style>
  :root { --bleu:#1f3a93; --bleu-clair:#e8edf8; --fond:#f4f6fa; --texte:#1c2433; --vert:#2e7d32; --vert-clair:#eaf5ea; --orange:#9a5000; --orange-clair:#fff3e3; --gris:#5a6375; --bord:#d9dfeb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic",sans-serif; background:var(--fond); color:var(--texte); font-size:20px; line-height:1.6; }
  header { background:var(--bleu); color:#fff; padding:20px 24px; }
  header .kicker { font-size:14px; letter-spacing:.06em; text-transform:uppercase; opacity:.85; }
  header h1 { margin:4px 0 0; font-size:24px; font-weight:650; }
  main { max-width:780px; margin:0 auto; padding:24px 20px 40px; }
  .card { background:#fff; border:1px solid var(--bord); border-radius:14px; padding:24px; margin-bottom:18px; }
  .card h2 { margin:0 0 10px; font-size:19px; }
  .note { background:var(--orange-clair); border:1px solid #f0c98f; color:var(--orange); border-radius:10px; padding:14px 16px; font-size:16px; margin-bottom:18px; }
  .info { background:#eef3ff; border:1px solid #b8c8f0; color:var(--bleu); border-radius:10px; padding:14px 16px; font-size:16px; margin-bottom:18px; }
  .btn { font:inherit; font-size:17px; border:none; border-radius:10px; padding:12px 18px; cursor:pointer; background:var(--bleu); color:#fff; min-height:48px; margin:4px 8px 4px 0; }
  .btn:hover { filter:brightness(1.08); }
  .btn:focus-visible, .theme:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid #7aa2f7; outline-offset:2px; }
  .btn.sec { background:var(--bleu-clair); color:var(--bleu); }
  .btn:disabled { opacity:.4; cursor:default; }
  .btn.discret { background:transparent; color:var(--gris); text-decoration:underline; }
  .btn.audio { background:#fff; color:var(--bleu); border:2px solid var(--bleu); }
  .picto { font-size:20px; margin-inline-end:6px; }
  .theme { display:flex; justify-content:space-between; align-items:center; gap:16px; width:100%; text-align:start; background:#fff; color:var(--texte); border:1px solid var(--bord); border-radius:12px; padding:16px 18px; margin-bottom:10px; cursor:pointer; font:inherit; }
  .theme:hover { border-color:var(--bleu); }
  .theme .titre { font-weight:600; font-size:18px; }
  .theme .sous { color:var(--gris); font-size:15px; display:block; margin-top:2px; }
  .barre { height:8px; background:#e3e8f2; border-radius:6px; overflow:hidden; margin:8px 0 4px; }
  .barre > div { height:100%; background:var(--vert); width:0; transition:width .3s; }
  .gris { color:var(--gris); font-size:15px; }
  .repere { font-size:14px; color:var(--gris); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; }
  .question { font-size:23px; font-weight:600; margin:4px 0 18px; line-height:1.4; }
  .reponse { background:var(--vert-clair); border-inline-start:5px solid var(--vert); border-radius:10px; padding:16px 18px; }
  .reponse .label { font-size:14px; text-transform:uppercase; letter-spacing:.05em; color:var(--vert); margin-bottom:4px; }
  .alerte { display:inline-block; background:var(--orange-clair); color:var(--orange); border:1px solid #f0c98f; border-radius:8px; padding:3px 10px; font-size:14px; margin-top:10px; }
  .nav { display:flex; flex-wrap:wrap; gap:4px; align-items:center; justify-content:space-between; }
  .clavier { color:var(--gris); font-size:14px; margin-top:10px; }
  @media (hover:none) { .clavier { display:none; } }
  .langue { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  select { font:inherit; font-size:17px; padding:8px 12px; border-radius:10px; border:1px solid var(--bord); background:#fff; }
  textarea { font:inherit; font-size:16px; padding:10px; border:1px solid var(--bord); border-radius:10px; width:100%; }
  .pied { color:var(--gris); font-size:14px; margin-top:28px; border-top:1px solid var(--bord); padding-top:14px; }
  [dir="rtl"] .theme .titre, [dir="rtl"] .question { text-align:right; }
</style>
</head>
<body>
<header>
  <div class="kicker" id="t-kicker"></div>
  <h1 id="t-title"></h1>
</header>
<main>
  <div class="langue">
    <label for="lang" class="gris" id="t-lang"></label>
    <select id="lang">

      <option value="ar">العربية</option>
      <option value="tr">Türkçe</option>
      <option value="uk">Українська</option>
      <option value="sq">Shqip</option>
      <option value="ka">ქართული</option>
      <option value="ps">پښتو</option>
      <option value="fa">دری</option>
      <option value="ru">Русский</option>
      <option value="en">English</option>
      <option value="ta">தமிழ்</option>
    </select>
  </div>
  <div class="note" id="t-note"></div>
  <div class="info" id="t-avert" style="display:none"></div>
  <div id="app"></div>
  <div class="card" id="retours">
    <h2><span class="picto" aria-hidden="true">📝</span><span id="t-rem"></span></h2>
    <textarea id="remarques" rows="6"></textarea>
    <div style="margin-top:10px"><button class="btn" id="telecharger"><span class="picto" aria-hidden="true">💾</span><span id="t-tel"></span></button></div>
  </div>
  <div class="pied" id="t-pied"></div>
</main>

  ru: { kicker:"Офлайн-повторение · тестовая версия", title:"Гражданский экзамен · Многолетний вид на жительство (CSP)", lang:"Язык", note:"Это инструмент для повторения, а не официальный ответ. Предложения должен проверить преподаватель.", avert:"Предлагаемый перевод, его должен проверить носитель языка. Вопросы остаются на французском (официальный список).", prog:"Прогресс", parc:"просмотрено", reset:"Сбросить прогресс", resetQ:"Стереть прогресс этого повторения на этом устройстве?", voir:"Показать предложение", prop:"Предложение для проверки", conf:"Подтвердить преподавателю", ecQ:"Прослушать вопрос", ecR:"Прослушать предложение", prec:"Назад", suiv:"Далее", themes:"К темам", clav:"Клавиши: ← и → для перехода, Enter для показа предложения.", rem:"Заметки с тестовой сессии", remH:"Запишите здесь, что понятно, что мешает, чего не хватает.", tel:"Скачать заметки", pied:"Вопросы: официальный список Министерства внутренних дел Франции (formation-civique.interieur.gouv.fr). Предложения: для повторения, не утверждены." },
  en: { kicker:"Offline revision · test version", title:"Civic exam · Multi-year residence permit (CSP)", lang:"Language", note:"Revision tool, not an official answer key. Suggested answers must be checked by a trainer.", avert:"Proposed translation, to be checked by a native speaker. Questions remain in French (official list).", prog:"Progress", parc:"reviewed", reset:"Reset progress", resetQ:"Clear the progress of this revision on this device?", voir:"Show suggested answer", prop:"Suggested answer to check", conf:"To be confirmed by a trainer", ecQ:"Listen to the question", ecR:"Listen to the answer", prec:"Previous", suiv:"Next", themes:"Back to themes", clav:"Shortcuts: ← and → to move, Enter to show the answer.", rem:"Notes from the test session", remH:"Write here what is clear, what is difficult, what is missing.", tel:"Download notes", pied:"Questions: official list published by the French Ministry of the Interior (formation-civique.interieur.gouv.fr). Suggested answers: for revision only, not validated." },
  ta: { kicker:"இணையமின்றி மறுபார்வை · சோதனை பதிப்பு", title:"குடியுரிமைத் தேர்வு · பல ஆண்டு வதிவிட அட்டை (CSP)", lang:"மொழி", note:"இது மறுபார்வைக் கருவி; அதிகாரபூர்வ விடைகள் அல்ல. பரிந்துரைகளைப் பயிற்சியாளர் சரிபார்க்க வேண்டும்.", avert:"முன்மொழியப்பட்ட மொழிபெயர்ப்பு, தாய்மொழி பேசுபவர் சரிபார்க்க வேண்டும். கேள்விகள் பிரெஞ்சில் உள்ளன (அதிகாரபூர்வ பட்டியல்).", prog:"முன்னேற்றம்", parc:"பார்க்கப்பட்டது", reset:"முன்னேற்றத்தை மீட்டமை", resetQ:"இந்தச் சாதனத்தில் இந்த மறுபார்வையின் முன்னேற்றத்தை அழிக்கவா?", voir:"பரிந்துரையைக் காட்டு", prop:"சரிபார்க்க வேண்டிய பரிந்துரை", conf:"பயிற்சியாளர் உறுதிசெய்ய வேண்டும்", ecQ:"கேள்வியைக் கேள்", ecR:"பரிந்துரையைக் கேள்", prec:"முந்தையது", suiv:"அடுத்தது", themes:"தலைப்புகளுக்குத் திரும்பு", clav:"குறுக்குவழிகள்: நகர ← மற்றும் →, பரிந்துரையைக் காண Enter.", rem:"சோதனை அமர்வின் குறிப்புகள்", remH:"தெளிவானவை, சிரமமானவை, விடுபட்டவை எதுவென இங்கே எழுதுங்கள்.", tel:"குறிப்புகளைப் பதிவிறக்கு", pied:"கேள்விகள்: பிரெஞ்சு உள்துறை அமைச்சகத்தின் அதிகாரபூர்வ பட்டியல் (formation-civique.interieur.gouv.fr). பரிந்துரைகள்: மறுபார்வைக்கு மட்டும், சரிபார்க்கப்படவில்லை." }
};
const RTL = ['ar','ps','fa'];

let lang = 'fr';
try { const l = localStorage.getItem('examen-civique-lang'); if (l && I[l]) lang = l; } catch (e) {}
const T = () => I[lang];

const CLE = 'examen-civique-csp-revision-v2';
let progress = {};
try { progress = JSON.parse(localStorage.getItem(CLE) || '{}') || {}; } catch (e) { progress = {}; }
const sauve = () => { try { localStorage.setItem(CLE, JSON.stringify(progress)); } catch (e) {} };
const app = document.getElementById('app');
const audioOk = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
let theme = null, index = 0, montre = false;

function lire(texte) {
  if (!audioOk) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(texte).replace(/<[^>]+>/g, ' '));
    u.lang = 'fr-FR'; u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch (e) {}
}

const total = () => DATA.reduce((n, t) => n + t.questions.length, 0);
const vuesDe = t => t.questions.filter((q, j) => progress[t.id + '-' + j] && progress[t.id + '-' + j].vue).length;
const pourcent = (a, b) => b ? Math.round(100 * a / b) : 0;
const firstNonVue = t => { for (let j = 0; j < t.questions.length; j++) if (!(progress[t.id + '-' + j] && progress[t.id + '-' + j].vue)) return j; return 0; };

function appliqueStatique() {
  const x = T();
  document.documentElement.lang = lang;
  document.documentElement.dir = RTL.includes(lang) ? 'rtl' : 'ltr';
  document.getElementById('t-kicker').textContent = x.kicker;
  document.getElementById('t-title').textContent = x.title;
  document.getElementById('t-lang').textContent = x.lang;
  document.getElementById('t-note').textContent = x.note;
  const av = document.getElementById('t-avert');
  if (lang === 'fr') av.style.display = 'none'; else { av.style.display = ''; av.textContent = x.avert; }
  document.getElementById('t-rem').textContent = x.rem;
  document.getElementById('remarques').placeholder = x.remH;
  document.getElementById('t-tel').textContent = x.tel;
  document.getElementById('t-pied').textContent = x.pied;
  document.getElementById('lang').value = lang;
}

function accueil() {
  theme = null;
  const x = T(), tot = total();
  const vues = DATA.reduce((n, t) => n + vuesDe(t), 0);
  let html = `<div class="card">
    <h2>${x.prog}</h2>
    <div class="gris">${vues} / ${tot} ${x.parc}</div>
    <div class="barre"><div style="width:${pourcent(vues, tot)}%"></div></div>
    <div class="nav" style="margin-top:12px">
      <span></span>
      <button class="btn discret" id="reinit">${x.reset}</button>
    </div>
  </div>`;
  DATA.forEach((t, i) => {
    const f = vuesDe(t);
    html += `<button class="theme" data-theme="${i}">
      <span><span class="titre">${t.titre}</span><span class="sous">${f} / ${t.questions.length} ${x.parc}</span>
      <span class="barre" style="display:block;width:220px;max-width:100%"><span style="display:block;height:100%;background:var(--vert);width:${pourcent(f, t.questions.length)}%"></span></span></span>
      <span aria-hidden="true" style="color:var(--bleu);font-size:22px">›</span>
    </button>`;
  });
  app.innerHTML = html;
  app.querySelectorAll('[data-theme]').forEach(b => b.onclick = () => { theme = +b.dataset.theme; index = firstNonVue(DATA[theme]); montre = false; affiche(); });
  document.getElementById('reinit').onclick = () => { if (confirm(x.resetQ)) { progress = {}; sauve(); accueil(); } };
  document.onkeydown = null;
}

function affiche() {
  const x = T();
  const t = DATA[theme], q = t.questions[index], n = t.questions.length, cle = t.id + '-' + index;
  let html = `<div class="card">
    <div class="repere">${t.titre} · ${index + 1} / ${n}</div>
    <div class="barre" style="margin-top:0"><div style="width:${pourcent(index + 1, n)}%"></div></div>
    <div class="question" style="margin-top:14px">${q.q}</div>`;
  if (!montre) {
    html += `<button class="btn" id="montrer"><span class="picto" aria-hidden="true">👁️</span>${x.voir}</button>` + (audioOk ? ` <button class="btn audio" id="ecoute-q"><span class="picto" aria-hidden="true">🔊</span>${x.ecQ}</button>` : '');
  } else {
    html += `<div class="reponse"><div class="label">${x.prop}</div>${q.r}` + (q.incertain ? `<br><span class="alerte">${x.conf}</span>` : '') + (audioOk ? `<br><button class="btn audio" id="ecoute-r" style="margin:10px 0 0"><span class="picto" aria-hidden="true">🔊</span>${x.ecR}</button>` : '') + `</div>`;
  }
  html += `</div>
  <div class="nav">
    <div>
      <button class="btn sec" id="prec" ${index === 0 ? 'disabled' : ''}><span class="picto" aria-hidden="true">⬅️</span>${x.prec}</button>
      <button class="btn sec" id="suiv" ${index >= n - 1 ? 'disabled' : ''}>${x.suiv}<span class="picto" aria-hidden="true" style="margin-inline-start:6px">➡️</span></button>
    </div>
    <button class="btn discret" id="themes"><span class="picto" aria-hidden="true">🏠</span>${x.themes}</button>
  </div>
  <div class="clavier">${x.clav}</div>`;
  app.innerHTML = html;
  const aller = d => { const k = index + d; if (k >= 0 && k < n) { index = k; montre = false; affiche(); } };
  const voir = () => { montre = true; progress[cle] = { vue: true }; sauve(); affiche(); };
  const m = document.getElementById('montrer'); if (m) m.onclick = voir;
  const eq = document.getElementById('ecoute-q'); if (eq) eq.onclick = () => lire(q.q);
  const er = document.getElementById('ecoute-r'); if (er) er.onclick = () => lire(q.r);
  document.getElementById('prec').onclick = () => aller(-1);
  document.getElementById('suiv').onclick = () => aller(1);
  document.getElementById('themes').onclick = accueil;
  window.scrollTo(0, 0);
  document.onkeydown = e => {
    if (theme === null) return;
    if (e.key === 'ArrowLeft') aller(RTL.includes(lang) ? 1 : -1);
    else if (e.key === 'ArrowRight') aller(RTL.includes(lang) ? -1 : 1);
    else if (e.key === 'Enter' && !montre) voir();
  };
}

document.getElementById('lang').onchange = e => {
  lang = e.target.value;
  try { localStorage.setItem('examen-civique-lang', lang); } catch (err) {}
  appliqueStatique();
  if (theme === null) accueil(); else affiche();
};

const zone = document.getElementById('remarques');
try { zone.value = localStorage.getItem(CLE + '-remarques') || ''; } catch (e) {}
zone.addEventListener('input', () => { try { localStorage.setItem(CLE + '-remarques', zone.value); } catch (e) {} });
document.getElementById('telecharger').onclick = () => {
  const date = new Date().toISOString().slice(0, 16).replace('T', ' ');
  const texte = 'Remarques de test - examen civique CSP (révision)\nLangue de l\'interface : ' + lang + '\nDate : ' + date + '\n\n' + (zone.value || '(aucune remarque)') + '\n';
  const url = URL.createObjectURL(new Blob([texte], { type: 'text/plain;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = 'remarques-test-civique.txt';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
};

appliqueStatique();
accueil();
</script>
</body>
</html>
